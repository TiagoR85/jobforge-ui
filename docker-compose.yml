name: jobforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobforge
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobforge-dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    command:
      - /bin/sh
      - -c
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic jobs.dispatch --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic jobs.dead --partitions 3 --replication-factor 1
    restart: "no"

  orchestrator:
    build:
      context: https://github.com/TiagoR85/jobforge-orchestrator.git#v1.1.1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=jobforge;Username=jobforge;Password=${POSTGRES_PASSWORD:-jobforge-dev}
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: kafka:9092
      OpenIddict__ClientSecret: ${OIDC_CLIENT_SECRET:?set in .env}
      Jwt__Authority: http://orchestrator:8094
      Jwt__RequireHttpsMetadata: "false"
      Kestrel__Endpoints__http__Url: http://+:8094
      Kestrel__Endpoints__grpc__Url: http://+:8097
    ports:
      - "8094:8094"
      - "8097:8097"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8094/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  runner:
    build:
      context: https://github.com/TiagoR85/jobforge-runner.git#v1.0.0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      orchestrator: { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:8095
      Urls: http://+:8095
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:9092
      Orchestrator__GrpcUrl: http://orchestrator:8097
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8095/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  ui:
    build: .
    depends_on:
      orchestrator: { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:8096
      JobForge__BaseUrl: http://orchestrator:8094
      JobForge__ClientSecret: ${OIDC_CLIENT_SECRET:?set in .env}
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30