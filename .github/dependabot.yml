# Portfolio CI policy: automated dependency updates (spec s9)
version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        interval: "weekly"
    - package-ecosystem: "nuget"
      directory: "/"
      schedule:
        interval: "weekly"
      # NLog + NLog.Web.AspNetCore must move together (NU1605 otherwise)
      groups:
        nlog:
          patterns:
            - "NLog*"
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
        interval: "weekly"
