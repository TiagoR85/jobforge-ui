name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      test-project: tests/JobForge.Ui.Tests/JobForge.Ui.Tests.csproj
      dotnet-version: "10.0.x"
      coverage-threshold: "80"

  docker-scan-ui:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-docker-scan.yml@v1
    with:
      image-name: jobforge-ui

  css-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/JobForge.Ui/package-lock.json
      - name: Install
        working-directory: src/JobForge.Ui
        run: npm ci
      - name: Build CSS
        working-directory: src/JobForge.Ui
        run: npm run build:css
      - name: Ensure committed CSS is up to date
        run: git diff --exit-code -- src/JobForge.Ui/wwwroot/css/tailwind.css